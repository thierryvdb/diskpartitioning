[workspace]
resolver = "2"
members = ["crates/disk-domain", "crates/disk-planner", "crates/storage-mock", "crates/storage-persistence", "crates/storage-common", "crates/storage-windows", "crates/storage-linux", "src-tauri"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-only"
authors = ["Thierry Vanden Broucke"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
